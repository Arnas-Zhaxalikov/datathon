<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qamqor AI — STAT.DATATHON-2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <span class="title">Qamqor AI</span>
        <span class="subtitle">STAT.DATATHON-2026 · AI for Official Statistics</span>
        <select id="lang-select" class="lang-select" data-i18n-aria="lang_label">
          <option value="en">English</option>
          <option value="kk">Қазақша</option>
          <option value="ru">Русский</option>
        </select>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="family" data-i18n="tab_family">My family</button>
        <button class="tab" data-tab="overview" data-i18n="tab_overview">Country overview</button>
        <button class="tab" data-tab="analyst" data-i18n="tab_analyst">Analysis (AI)</button>
      </nav>
    </header>

    <main class="content">
      <!-- ============ Моя семья ============ -->
      <section id="panel-family" class="panel active">
        <div class="panel-inner">
          <h2 data-i18n="family_title">Your family profile</h2>
          <p class="hint" data-i18n="family_hint"></p>

          <form id="family-form" class="form-grid">
            <label><span data-i18n="f_hh_size">Family size</span>
              <input type="number" id="f-hh-size" min="1" value="4" required>
            </label>
            <label><span data-i18n="f_n_child">Children</span>
              <input type="number" id="f-n-child" min="0" value="2" required>
            </label>
            <label><span data-i18n="f_n_employed">Working family members</span>
              <input type="number" id="f-n-employed" min="0" value="1" required>
            </label>
            <label><span data-i18n="f_income">Family income per month, KZT</span>
              <input type="number" id="f-income" min="0" step="1000" value="200000" required>
            </label>
            <label><span data-i18n="f_settlement">Where you live</span>
              <select id="f-settlement">
                <option value="город" data-i18n="city">City</option>
                <option value="село" data-i18n="village">Village</option>
              </select>
            </label>
            <button type="submit" class="btn-primary" data-i18n="calc">Calculate</button>
          </form>

          <div id="family-result" class="result hidden"></div>
        </div>
      </section>

      <!-- ============ Обзор по стране ============ -->
      <section id="panel-overview" class="panel">
        <div class="panel-inner">
          <h2 data-i18n="overview_title">Who official poverty statistics do not see</h2>
          <p class="hint" id="overview-hint"></p>
          <div class="tiles" id="overview-tiles"></div>
          <p class="hint small" data-i18n-html="overview_note"></p>
        </div>
      </section>

      <!-- ============ Для анализа (ИИ) ============ -->
      <section id="panel-analyst" class="panel">
        <div class="chat" id="chat">
          <div class="row assistant intro">
            <div class="avatar" data-i18n="avatar_ai">AI</div>
            <div class="bubble">
              <p data-i18n="chat_intro"></p>
            </div>
          </div>
        </div>
        <form id="form" class="composer">
          <textarea id="input" data-i18n-placeholder="chat_placeholder" rows="1"></textarea>
          <button type="submit" id="send" data-i18n="send">Send</button>
        </form>
      </section>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
