<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qamqor AI — STAT.DATATHON-2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a7d93'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round'%3E%3Ccircle cx='16' cy='16' r='9.5'/%3E%3Cpath d='M12 7.6Q14.6 16 12 24.4M20 7.6Q17.4 16 20 24.4M7.6 12Q16 14.6 24.4 12M7.6 20Q16 17.4 24.4 20'/%3E%3C/g%3E%3C/svg%3E">
<script>
  // тема ставится до отрисовки, чтобы страница не мигала: сохранённый выбор, иначе системная настройка
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

  <!-- Каркас: на широком экране бренд, навигация и настройки стоят боковой панелью,
       на узком — бренд и настройки сверху, навигация снизу (см. .app в style.css) -->
  <div class="app">
    <div class="brand">
      <!-- знак — шанырак: круг с перекрещёнными дугами, символ дома и семьи -->
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="logo-bg" width="32" height="32" rx="8"/>
        <g class="logo-mark">
          <circle cx="16" cy="16" r="9.5"/>
          <path d="M12 7.6Q14.6 16 12 24.4M20 7.6Q17.4 16 20 24.4M7.6 12Q16 14.6 24.4 12M7.6 20Q16 17.4 24.4 20"/>
        </g>
      </svg>
      <span class="title">Qamqor <span class="title-ai">AI</span></span>
    </div>

    <nav class="nav" id="tabs" data-i18n-aria="nav_label">
      <button type="button" class="tab active" data-tab="family" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
        <span data-i18n="tab_family">My family</span>
      </button>
      <button type="button" class="tab" data-tab="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        <span data-i18n="tab_overview">Country overview</span>
      </button>
      <button type="button" class="tab" data-tab="analyst">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
        <span data-i18n="tab_analyst">Analysis (AI)</span>
      </button>
    </nav>

    <div class="controls">
      <select id="lang-select" class="lang-select" data-i18n-aria="lang_label">
        <option value="en">English</option>
        <option value="kk">Қазақша</option>
        <option value="ru">Русский</option>
      </select>
      <button type="button" id="theme-toggle" class="icon-btn" data-i18n-aria="theme_label">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      </button>
      <span class="controls-note">STAT.DATATHON-2026 · AI for Official Statistics</span>
    </div>

    <main class="content" id="main" tabindex="-1">
      <!-- ============ Моя семья ============ -->
      <section id="panel-family" class="panel active" aria-labelledby="family-h">
        <div class="page page-wide">
          <header class="page-head">
            <h1 id="family-h" data-i18n="family_title">Your family profile</h1>
            <p class="page-lead" data-i18n="family_hint"></p>
          </header>

          <div class="family-layout">
            <form id="family-form" class="card form-card" novalidate>
              <fieldset>
                <legend data-i18n="f_main_title"></legend>
                <div class="form-grid">
                  <label class="field"><span data-i18n="f_hh_size">Family size</span>
                    <input type="number" id="f-hh-size" min="1" max="30" step="1" value="4" inputmode="numeric" required>
                  </label>
                  <label class="field"><span data-i18n="f_n_child">Children</span>
                    <input type="number" id="f-n-child" min="0" max="30" step="1" value="2" inputmode="numeric" required>
                  </label>
                  <label class="field"><span data-i18n="f_n_employed">Working family members</span>
                    <input type="number" id="f-n-employed" min="0" max="30" step="1" value="1" inputmode="numeric" required>
                  </label>
                  <label class="field"><span data-i18n="f_income">Family income per month, KZT</span>
                    <input type="number" id="f-income" min="0" step="1000" value="200000" inputmode="numeric" required>
                  </label>
                  <label class="field span-2"><span data-i18n="f_region">Region</span>
                    <select id="f-region" required></select>
                  </label>
                </div>
              </fieldset>

              <fieldset>
                <legend data-i18n="f_optional_title"></legend>
                <div class="form-grid">
                  <label class="field span-2"><span data-i18n="f_earner_wage"></span>
                    <input type="number" id="f-earner-wage" min="0" step="1000" inputmode="numeric" data-i18n-placeholder="ph_optional">
                  </label>
                  <label class="check span-2">
                    <input type="checkbox" id="f-self-employed">
                    <span data-i18n="f_self_employed"></span>
                  </label>
                  <label class="field span-2"><span data-i18n="f_transfers"></span>
                    <input type="number" id="f-transfers" min="0" step="1000" inputmode="numeric" data-i18n-placeholder="ph_optional">
                  </label>
                  <label class="field span-2"><span data-i18n="f_housing"></span>
                    <input type="number" id="f-housing" min="0" step="1000" inputmode="numeric" data-i18n-placeholder="ph_optional">
                  </label>
                </div>
              </fieldset>

              <p id="family-error" class="form-error hidden" role="alert"></p>
              <button type="submit" class="btn btn-primary" data-i18n="calc">Calculate</button>
            </form>

            <div class="result-col" aria-live="polite">
              <!-- пока расчёта нет -->
              <div id="family-empty" class="card empty-state">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
                <h2 data-i18n="empty_title"></h2>
                <p data-i18n="empty_text"></p>
              </div>

              <!-- Разметка результата статична: расчёт только заполняет числа и тексты,
                   поэтому ползунки не пересоздаются при пересчёте -->
              <div id="family-result" class="result hidden">
                <!-- статус, ключевые числа, шкала, вывод -->
                <section class="card">
                  <div class="status-banner" id="r-banner">
                    <span class="status-dot" id="r-dot"></span>
                    <div>
                      <h2 class="result-label" id="r-label"></h2>
                      <p class="result-sub" id="r-sub"></p>
                    </div>
                  </div>

                  <dl class="stats">
                    <div class="stat"><dt data-i18n="st_income"></dt><dd id="st-income"></dd></div>
                    <div class="stat"><dt data-i18n="st_sm"></dt><dd id="st-sm"></dd></div>
                    <div class="stat"><dt data-i18n="st_asp"></dt><dd id="st-asp"></dd></div>
                  </dl>

                  <div class="meter">
                    <div class="meter-flag" id="m-worst"><i class="mk mk-worst"></i><span></span></div>
                    <div class="meter-flag" id="m-now"><i class="mk mk-now"></i><span></span></div>
                    <div class="meter-track">
                      <div class="meter-zone zone-a" id="z-a"></div>
                      <div class="meter-zone zone-b" id="z-b"></div>
                      <div class="meter-zone zone-c"></div>
                      <div class="meter-marker marker-worst" id="mk-worst"></div>
                      <div class="meter-marker marker-now" id="mk-now"></div>
                    </div>
                    <div class="meter-bounds">
                      <div class="meter-bound bound-asp" id="b-asp"><span></span></div>
                      <div class="meter-bound bound-sm" id="b-sm"><span></span></div>
                    </div>
                    <div class="meter-zones-legend">
                      <span><i class="sw zone-a"></i><span data-i18n="z_a"></span></span>
                      <span><i class="sw zone-b"></i><span data-i18n="z_b"></span></span>
                      <span><i class="sw zone-c"></i><span data-i18n="z_c"></span></span>
                    </div>
                  </div>

                  <p class="outcome" id="r-outcome"></p>
                  <p class="outcome-link hidden" id="r-link"><a target="_blank" rel="noopener" data-i18n="out_E_link"></a></p>
                  <p class="peers hidden" id="r-peers"></p>

                  <div class="assumptions">
                    <h3 class="assumptions-title" data-i18n="as_title"></h3>
                    <ul id="r-assumptions"></ul>
                  </div>
                </section>

                <!-- три стресс-теста -->
                <section class="card">
                  <h2 class="card-title" data-i18n="sc_title"></h2>
                  <p class="card-lead" data-i18n="sc_hint"></p>

                  <div class="scenario" data-scenario="fail_earner_loss">
                    <div class="scenario-head">
                      <h3 class="scenario-title" data-i18n="sc_earner_title"></h3>
                      <span class="scenario-flag hidden"><span aria-hidden="true">⚠</span> <span data-i18n="sc_cross"></span></span>
                    </div>
                    <label class="slider"><span id="s-months-label"></span>
                      <input type="range" id="s-months" min="1" max="12" step="1" value="3">
                    </label>
                    <p class="scenario-assume" data-assume></p>
                    <div class="scenario-line"><span data-i18n="sc_year_label"></span><b data-value></b></div>
                    <div class="scenario-formula" data-formula></div>
                  </div>

                  <div class="scenario" data-scenario="fail_cost_of_living">
                    <div class="scenario-head">
                      <h3 class="scenario-title" data-i18n="sc_col_title"></h3>
                      <span class="scenario-flag hidden"><span aria-hidden="true">⚠</span> <span data-i18n="sc_cross"></span></span>
                    </div>
                    <label class="slider"><span id="s-col-label"></span>
                      <input type="range" id="s-col" min="5" max="30" step="5" value="10">
                    </label>
                    <p class="scenario-assume" data-assume></p>
                    <div class="scenario-line"><span data-i18n="sc_real_label"></span><b data-value></b></div>
                    <div class="scenario-formula" data-formula></div>
                  </div>

                  <div class="scenario" data-scenario="fail_utilities">
                    <div class="scenario-head">
                      <h3 class="scenario-title" data-i18n="sc_housing_title"></h3>
                      <span class="scenario-flag hidden"><span aria-hidden="true">⚠</span> <span data-i18n="sc_cross"></span></span>
                    </div>
                    <label class="slider"><span id="s-rise-label"></span>
                      <input type="range" id="s-rise" min="5" max="100" step="5" value="30">
                    </label>
                    <p class="scenario-assume" data-assume></p>
                    <div class="scenario-line"><span data-i18n="sc_pp_label"></span><b data-value></b></div>
                    <div class="scenario-formula" data-formula></div>
                  </div>
                </section>

                <!-- а что, если -->
                <section class="card">
                  <h2 class="card-title" data-i18n="wi_title"></h2>
                  <div class="form-grid whatif-form">
                    <label class="field"><span data-i18n="wi_wage"></span>
                      <input type="number" id="w-wage" min="0" step="10000" inputmode="numeric" placeholder="0">
                    </label>
                    <label class="field"><span data-i18n="wi_allowance"></span>
                      <input type="number" id="w-allowance" min="0" step="1000" inputmode="numeric" placeholder="0">
                    </label>
                  </div>
                  <p class="card-lead whatif-empty" id="w-empty" data-i18n="wi_empty"></p>
                  <div class="whatif hidden" id="w-result">
                    <div class="whatif-col">
                      <div class="whatif-cap" data-i18n="wi_before"></div>
                      <div class="whatif-status"><span class="status-dot" id="w-before-dot"></span><span id="w-before-label"></span></div>
                      <div class="whatif-num" id="w-before-num"></div>
                    </div>
                    <div class="whatif-arrow" aria-hidden="true">→</div>
                    <div class="whatif-col">
                      <div class="whatif-cap" data-i18n="wi_after"></div>
                      <div class="whatif-status"><span class="status-dot" id="w-after-dot"></span><span id="w-after-label"></span></div>
                      <div class="whatif-num" id="w-after-num"></div>
                    </div>
                  </div>
                </section>

                <p class="footnote" id="r-foot"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ Обзор по стране ============ -->
      <section id="panel-overview" class="panel" aria-labelledby="overview-h">
        <div class="page">
          <header class="page-head">
            <h1 id="overview-h" data-i18n="overview_title">Who official poverty statistics do not see</h1>
            <p class="page-lead" id="overview-hint"></p>
          </header>

          <section class="card hidden" id="overview-dist-card">
            <h2 class="card-title" data-i18n="ov_dist_title"></h2>
            <div class="dist-bar" id="overview-dist" role="img"></div>
            <div class="tiles" id="overview-tiles"></div>
          </section>
          <div id="overview-status"></div>

          <section class="card hidden" id="overview-regions">
            <h2 class="card-title" data-i18n="ov_regions_title"></h2>
            <div class="table-wrap"><table class="region-table" id="overview-region-table"></table></div>
          </section>
          <p class="footnote" id="overview-note"></p>
        </div>
      </section>

      <!-- ============ Для анализа (ИИ) ============ -->
      <section id="panel-analyst" class="panel" aria-labelledby="analyst-h">
        <h1 id="analyst-h" class="sr-only" data-i18n="tab_analyst"></h1>
        <div class="chat" id="chat" aria-live="polite">
          <div class="row assistant intro">
            <div class="avatar" data-i18n="avatar_ai">AI</div>
            <div class="bubble">
              <p data-i18n="chat_intro"></p>
              <div class="suggestions" id="suggestions">
                <button type="button" class="suggestion" data-i18n="sug_1"></button>
                <button type="button" class="suggestion" data-i18n="sug_2"></button>
                <button type="button" class="suggestion" data-i18n="sug_3"></button>
              </div>
            </div>
          </div>
        </div>
        <div class="composer-wrap">
          <form id="form" class="composer">
            <textarea id="input" data-i18n-placeholder="chat_placeholder" data-i18n-aria="chat_placeholder" rows="1"></textarea>
            <button type="submit" id="send" class="send-btn" data-i18n-aria="send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/></svg>
            </button>
          </form>
          <p class="composer-hint" data-i18n="chat_hint"></p>
        </div>
      </section>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
